# ══════════════════════════════════════════════════════════════════
# PUBLISH GITHUB RELEASE
# ══════════════════════════════════════════════════════════════════
  release:
    name: "Publish Release"
    needs:
      - build-linux-amd64
      - build-linux-arm64
      - build-windows
      - build-macos-intel
      - build-macos-arm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: ver
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Flatten artifact directories
        run: |
          find artifacts/ -type f \( \
            -name "*.deb" -o \
            -name "*.tar.gz" -o \
            -name "*.exe" -o \
            -name "*.zip" -o \
            -name "*.pkg" -o \
            -name "checksums-*.txt" \
          \) -exec mv {} release-assets/ \; 2>/dev/null || true
          mkdir -p release-assets
          find artifacts/ -type f \( \
            -name "*.deb" -o \
            -name "*.tar.gz" -o \
            -name "*.exe" -o \
            -name "*.zip" -o \
            -name "*.pkg" -o \
            -name "checksums-*.txt" \
          \) -exec cp {} release-assets/ \;

      - name: Merge all checksums
        run: |
          VER=${{ steps.ver.outputs.VERSION }}
          {
            echo "# SHA256 Checksums — Zephyx v${VER}"
            echo "#"
            echo "# Verify on Linux/macOS:"
            echo "#   sha256sum --check checksums.txt"
            echo "#"
            echo "# Verify on Windows (PowerShell):"
            echo "#   Get-FileHash <file> -Algorithm SHA256"
            echo ""
            cat release-assets/checksums-*.txt
          } > release-assets/checksums.txt

      - name: Generate release notes
        id: notes
        run: |
          VER=${{ steps.ver.outputs.VERSION }}
          cat > release-assets/release-notes.md << NOTES
          ## ⚡ Zephyx v${VER}

          > Extensible Cybersecurity Operating Platform — workflow-driven, intelligence-augmented.

          ---

          ### 📦 Downloads

          | Platform | Package | Portable |
          |---|---|---|
          | 🐧 Linux x86_64 | [Zephyx-${VER}-linux-amd64.deb](https://github.com/Ghost-101-ui/Zephyx/releases/download/v${VER}/Zephyx-${VER}-linux-amd64.deb) | [.tar.gz](https://github.com/Ghost-101-ui/Zephyx/releases/download/v${VER}/Zephyx-${VER}-linux-amd64.tar.gz) |
          | 🐧 Linux ARM64 | [Zephyx-${VER}-linux-arm64.deb](https://github.com/Ghost-101-ui/Zephyx/releases/download/v${VER}/Zephyx-${VER}-linux-arm64.deb) | [.tar.gz](https://github.com/Ghost-101-ui/Zephyx/releases/download/v${VER}/Zephyx-${VER}-linux-arm64.tar.gz) |
          | 🪟 Windows x64 | [Zephyx-${VER}-windows-x64-setup.exe](https://github.com/Ghost-101-ui/Zephyx/releases/download/v${VER}/Zephyx-${VER}-windows-x64-setup.exe) | [.zip](https://github.com/Ghost-101-ui/Zephyx/releases/download/v${VER}/Zephyx-${VER}-windows-x64.zip) |
          | 🍎 macOS Intel | [Zephyx-${VER}-macos-intel.pkg](https://github.com/Ghost-101-ui/Zephyx/releases/download/v${VER}/Zephyx-${VER}-macos-intel.pkg) | [.tar.gz](https://github.com/Ghost-101-ui/Zephyx/releases/download/v${VER}/Zephyx-${VER}-macos-intel.tar.gz) |
          | 🍎 macOS Apple Silicon | [Zephyx-${VER}-macos-arm.pkg](https://github.com/Ghost-101-ui/Zephyx/releases/download/v${VER}/Zephyx-${VER}-macos-arm.pkg) | [.tar.gz](https://github.com/Ghost-101-ui/Zephyx/releases/download/v${VER}/Zephyx-${VER}-macos-arm.tar.gz) |

          ---

          ### 🚀 Quick Install

          **Linux / macOS (one-liner):**
          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/Ghost-101-ui/Zephyx/main/scripts/install.sh | sh
          \`\`\`

          **Windows (PowerShell):**
          \`\`\`powershell
          irm https://raw.githubusercontent.com/Ghost-101-ui/Zephyx/main/scripts/install.ps1 | iex
          \`\`\`

          **Linux .deb:**
          \`\`\`bash
          wget https://github.com/Ghost-101-ui/Zephyx/releases/download/v${VER}/Zephyx-${VER}-linux-amd64.deb
          sudo dpkg -i Zephyx-${VER}-linux-amd64.deb
          zpx init
          \`\`\`

          ---

          ### 🔐 Verify Checksums

          Download \`checksums.txt\` and verify:
          \`\`\`bash
          sha256sum --check checksums.txt
          \`\`\`

          ---

          ### 🆕 What's Changed

          See [CHANGELOG.md](https://github.com/Ghost-101-ui/Zephyx/blob/main/CHANGELOG.md) for full details.

          ---

          ### ⚠️ Authorized Use Only

          Zephyx is designed for authorized penetration testing, CTF competitions, and educational security research.
          NOTES

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "⚡ Zephyx v${{ steps.ver.outputs.VERSION }}"
          body_path: release-assets/release-notes.md
          draft: false
          prerelease: false
          make_latest: true
          files: |
            release-assets/*.deb
            release-assets/*.tar.gz
            release-assets/*.exe
            release-assets/*.zip
            release-assets/*.pkg
            release-assets/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
