[package]
name = "zpx-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Zephyx — Extensible Cybersecurity Operating Platform"
homepage.workspace = true
repository.workspace = true

[[bin]]
name = "zpx"
path = "src/main.rs"

[dependencies]
zpx-core = { path = "../zpx-core" }
zpx-tui = { path = "../zpx-tui" }
tokio.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
chrono.workspace = true
reqwest.workspace = true
semver.workspace = true
tempfile.workspace = true

[package.metadata.deb]
name = "zephyx"
maintainer = "Zephyx Core Team <team@zephyx.dev>"
copyright = "2026 Zephyx Core Team"
extended-description = """\
Zephyx is a workflow-driven cybersecurity operating platform built in Rust.
It orchestrates security tools, manages assessment sessions,
tracks findings, builds knowledge graphs, and generates professional reports.
"""
depends = ""
section = "net"
priority = "optional"
assets = [
    ["target/release/zpx", "usr/local/bin/", "755"],
]

